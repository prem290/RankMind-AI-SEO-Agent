version: '3.8'

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
    environment:
      - HINDSIGHT_PORT=8888

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - HINDSIGHT_BASE_URL=http://hindsight:8888
      - DEMO_MODE=true
    depends_on:
      - hindsight

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
